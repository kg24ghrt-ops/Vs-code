# .github/workflows/build.yml
name: Build Handwriting Studio

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v7[reference:9]

      # 2. 设置 Java 环境 (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v5[reference:10]
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. 设置 Rust 工具链
      - name: Install Rust toolchain
        uses: step-security/actions-rs-toolchain@v1[reference:11]
        with:
          toolchain: stable
          override: true

      # 4. 安装 Android 目标平台
      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android[reference:12]

      # 5. 设置 Android NDK r27
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1[reference:13]
        with:
          ndk-version: r27[reference:14]
          add-to-path: false

      # 6. 设置环境变量 (让 cargo-ndk 能找到 NDK)
      - name: Set NDK environment variable
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV

      # 7. 安装 cargo-ndk
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked[reference:15]

      # 8. 缓存 Rust 依赖 (加速构建)
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2[reference:16]

      # 9. 编译 Rust 库 (为多个 ABI)
      - name: Build Rust library for Android
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build --release[reference:17]

      # 10. 复制编译好的 .so 文件到 Android 项目
      - name: Copy native libraries to Android project
        run: |
          mkdir -p app/src/main/jniLibs
          cp -r target/release/jniLibs/* app/src/main/jniLibs/

      # 11. 使用 Gradle 构建 Android App
      - name: Build Android App with Gradle
        uses: gradle/actions/setup-gradle@v4[reference:18]
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Execute Gradle build
        run: ./gradlew assembleDebug

      # 12. (可选) 上传 APK 作为构建产物
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk