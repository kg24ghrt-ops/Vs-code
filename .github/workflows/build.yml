name: Build Android App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Execute Gradle assemble
        run: ./gradlew assembleDebug

      # Rename the APK with the run number or a version string
      - name: Rename APK with version
        run: |
          VERSION="${{ github.run_number }}"
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-debug-v${VERSION}.apk

      # Upload the versioned APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-v${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug-v${{ github.run_number }}.apk
