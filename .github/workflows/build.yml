name: Build Handwriting Studio

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code (use v4)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK 17 for Android build
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Install Rust toolchain (official action)
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      # 4. Add Android Rust targets
      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      # 5. Install cargo-ndk (for cross‑compilation)
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # 6. Set up Android NDK r27
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: false

      # 7. Set NDK environment variable (required by cargo-ndk)
      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> $GITHUB_ENV

      # 8. Cache Rust dependencies (speeds up builds)
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # 9. Build Rust library for all target ABIs
      - name: Build Rust library for Android
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 build --release

      # 10. Copy compiled .so files to the Android project
      - name: Copy native libraries
        run: |
          mkdir -p app/src/main/jniLibs
          cp -r target/release/jniLibs/* app/src/main/jniLibs/

      # 11. Build the Android app with Gradle
      - name: Build Android App
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Execute Gradle build
        run: ./gradlew assembleDebug

      # 12. Upload the resulting APK as an artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk